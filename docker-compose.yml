services:
  frontend:
    image: rohitpal123/frontend-web:latest
    container_name: frontend-web
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: rohitpal123/backend-web:latest
    container_name: backend-web
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sms
      MYSQL_USER: sms
      MYSQL_PASSWORD: root9090
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: sms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root9090
      MYSQL_DATABASE: sms
      MYSQL_USER: sms
      MYSQL_PASSWORD: root9090
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot9090"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: